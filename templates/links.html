<!DOCTYPE html>
<html lang="en" data-theme="black">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
</head>
<body class="min-h-screen bg-base-200 text-base-content">
  <div class="mx-auto max-w-4xl px-4 py-4 sm:px-6 lg:px-8">
    <header class="navbar rounded-box border border-base-300 bg-base-100 shadow-sm">
      <div class="flex-1">
        <a class="btn btn-ghost text-xl text-base-content">Bookmark Messages</a>
      </div>
      <div class="flex-none">
        <ul class="menu menu-horizontal px-1">
          <li><a>Submit</a></li>
        </ul>
      </div>
    </header>

    {% macro link_card(link) %}
      {% set hostname = link.hostname %}
      <article class="card card-compact border border-base-300 bg-base-100 shadow-sm">
        <div class="card-body p-4">
          <div class="flex items-center gap-3">
            <div class="avatar">
              <div class="w-5 rounded">
                <img src="{{ link.favicon_url }}" alt="favicon for {{ hostname }}" />
              </div>
            </div>

            <div class="min-w-0 flex-1">
              <a class="truncate font-semibold text-base-content transition-opacity hover:opacity-80" href="{{ link.url }}" target="_blank" rel="noopener noreferrer">
                {{ hostname }}
              </a>
            </div>

            <span class="badge badge-secondary badge-sm">link</span>
          </div>
        </div>
      </article>
    {% endmacro %}

    <main class="mt-6 space-y-3">
      {% for link in links %}
        {{ link_card(link) }}
      {% else %}
        <div class="rounded-box border border-base-300 bg-base-100 p-4 text-sm text-base-content/80">
          No links found.
        </div>
      {% endfor %}
    </main>
  </div>
</body>
</html>
