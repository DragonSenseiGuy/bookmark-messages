<!DOCTYPE html>
<html lang="en" data-theme="black">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin login · Bookmark Messages</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
</head>
<body class="min-h-screen bg-base-200 text-base-content">
  <main class="mx-auto flex min-h-screen max-w-md items-center px-4 py-8">
    <article class="card w-full border border-base-300 bg-base-100 shadow-sm">
      <div class="card-body">
        <div class="text-xs font-semibold uppercase tracking-widest text-base-content/60">Admin</div>
        <h1 class="card-title text-xl">Bookmark Messages</h1>
        {% if configured %}
          {% with messages = get_flashed_messages(with_categories=true) %}
            {% for _, message in messages %}
              <div class="alert alert-error mt-2 py-2 text-sm"><span>{{ message }}</span></div>
            {% endfor %}
          {% endwith %}
          <form method="post" class="mt-3 space-y-3">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label class="form-control">
              <span class="label-text mb-1 text-sm">Email</span>
              <input type="email" name="email" required autocomplete="username"
                     class="input input-bordered w-full">
            </label>
            <label class="form-control">
              <span class="label-text mb-1 text-sm">Password</span>
              <input type="password" name="password" required autocomplete="current-password"
                     class="input input-bordered w-full">
            </label>
            <button type="submit" class="btn btn-primary mt-2 w-full">Log in</button>
          </form>
        {% else %}
          <div class="alert alert-error mt-3 text-sm">
            <span>Set ADMIN_EMAIL and ADMIN_PASSWORD, then restart the app.</span>
          </div>
        {% endif %}
        <a href="{{ url_for('links') }}" class="btn btn-ghost btn-sm mt-2">Back</a>
      </div>
    </article>
  </main>
</body>
</html>
